<app-pre-loader></app-pre-loader>
<div id="smooth-wrapper">
    <div id="smooth-content">
        <router-outlet />
    </div>
</div>

<div class="modal fade" id="applyJobModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">

            <!-- Modal Header -->
            <div class="modal-header">
                <h5 class="modal-title">Apply for Position</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <!-- Modal Body -->
            <div class="modal-body">
                <form class="tj-apply-form">

                    <div class="row g-3">

                        <!-- Full Name -->
                        <div class="col-md-6">
                            <label class="form-label">Full Name *</label>
                            <input type="text" class="form-control" placeholder="Your full name" required>
                        </div>

                        <!-- Email -->
                        <div class="col-md-6">
                            <label class="form-label">Email Address *</label>
                            <input type="email" class="form-control" placeholder="example@email.com" required>
                        </div>

                        <!-- Phone -->
                        <div class="col-md-6">
                            <label class="form-label">Phone Number *</label>
                            <input type="tel" class="form-control" placeholder="+966 XXXXXXXX" required>
                        </div>

                        <!-- Position -->
                        <div class="col-md-6">
                            <label class="form-label">Position Applying For *</label>
                            <input type="text" class="form-control" value="Business Strategy Consultant" readonly>
                        </div>

                        <!-- Location -->
                        <div class="col-md-6">
                            <label class="form-label">Current Location</label>
                            <input type="text" class="form-control" placeholder="City, Country">
                        </div>

                        <!-- Resume -->
                        <div class="col-12">
                            <label class="form-label">Upload Resume (PDF / DOC) *</label>
                            <input type="file" class="form-control" accept=".pdf,.doc,.docx" required>
                            <small class="text-muted">Max size: 5MB</small>
                        </div>

                        <!-- Message -->
                        <div class="col-12">
                            <label class="form-label">Cover Letter / Message</label>
                            <textarea class="form-control" rows="4"
                                placeholder="Briefly tell us why you are suitable for this role"></textarea>
                        </div>

                    </div>

                </form>
            </div>

            <!-- Modal Footer -->
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">
                    Cancel
                </button>
                <button type="submit" class="btn btn-primary">
                    Submit Application
                </button>
            </div>

        </div>
    </div>
</div>
