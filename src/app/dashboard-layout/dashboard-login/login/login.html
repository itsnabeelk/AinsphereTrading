<div class="container-xxl">
    <div class="row vh-100 d-flex justify-content-center">
        <div class="col-12 align-self-center">
            <div class="card-body">
                <div class="row">
                    <div class="col-lg-4 mx-auto">
                        <div class="card">

                            <!-- Header -->
                            <div class="card-body p-0 bg-black auth-header-box rounded-top">
                                <div class="text-center p-3">
                                    <h4 class="mt-3 mb-1 fw-semibold text-white fs-18">
                                        Dashboard Login
                                    </h4>
                                    <p class="text-muted fw-medium mb-0">
                                        Sign in to continue
                                    </p>
                                </div>
                            </div>

                            <!-- Body -->
                            <div class="card-body pt-0">
                                <form class="my-4" (ngSubmit)="login()">

                                    <div class="form-group mb-2">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control" [(ngModel)]="email" name="email"
                                            placeholder="Enter email" required>
                                    </div>

                                    <div class="form-group mb-2">
                                        <label class="form-label">Password</label>
                                        <input type="password" class="form-control" [(ngModel)]="password"
                                            name="password" placeholder="Enter password" required>
                                    </div>

                                    <div *ngIf="errorMessage" class="alert alert-danger mt-2">
                                        {{ errorMessage }}
                                    </div>

                                    <div class="form-group mb-0 row">
                                        <div class="col-12">
                                            <div class="d-grid mt-3">
                                                <button class="btn btn-primary" type="submit" [disabled]="loading">
                                                    {{ loading ? 'Signing in...' : 'Login' }}
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                </form>

                                <div class="text-center mb-2">
                                    <p class="text-muted">
                                        Forgot password?
                                        <a routerLink="/dashboard/reset-password" class="text-primary ms-2">
                                            Reset here
                                        </a>
                                    </p>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
