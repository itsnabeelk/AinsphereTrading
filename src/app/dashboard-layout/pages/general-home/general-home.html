<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index:1100;">

    <div id="generalToast" class="toast text-white">
        <div class="d-flex">
            <div class="toast-body" id="generalToastBody"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>


<div class="container-fluid py-4">

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <h4 class="mb-4 fw-semibold">General Home Management</h4>

            <!-- ================= TABS ================= -->
            <ul class="nav nav-tabs mb-4" id="generalHomeTabs">
                <li class="nav-item">
                    <button class="nav-link active" data-bs-target="#heroTab">
                        Hero Section
                    </button>
                </li>

                <li class="nav-item">
                    <button class="nav-link" data-bs-target="#aboutTab">
                        About Section
                    </button>
                </li>

                <li class="nav-item">
                    <button class="nav-link" data-bs-target="#servicesTab">
                        Services Section
                    </button>
                </li>
            </ul>

            <!-- ================= TAB CONTENT ================= -->
            <div class="tab-content">

                <!-- ================= HERO TAB ================= -->
                <div class="tab-pane fade show active" id="heroTab">

                    <div class="d-flex justify-content-between mb-3">
                        <h5>Hero Slides</h5>
                        <button class="btn btn-primary" (click)="openHeroModal()">
                            + Add Slide
                        </button>
                    </div>

                    <div class="row g-3">

                        <div class="col-md-3 col-sm-6" *ngFor="let hero of heroes">

                            <div class="card h-100 shadow-sm">

                                <img [src]="getImage(hero.image)" class="card-img-top"
                                    style="height:140px;object-fit:cover;">

                                <div class="card-body">

                                    <h6>{{ hero.title_en }}</h6>

                                    <div class="d-flex justify-content-between mt-3">

                                        <button class="btn btn-sm btn-outline-primary" (click)="editHero(hero)">
                                            Edit
                                        </button>

                                        <button class="btn btn-sm btn-outline-danger"
                                            (click)="openDeleteModal(hero.id)">
                                            Delete
                                        </button>

                                        <button class="btn btn-sm"
                                            [ngClass]="hero.is_active ? 'btn-success' : 'btn-secondary'"
                                            (click)="toggleHero(hero.id)">
                                            {{ hero.is_active ? 'Active' : 'Inactive' }}
                                        </button>

                                    </div>

                                </div>
                            </div>

                        </div>

                    </div>

                </div>

                <!-- About Tab Placeholder -->
                <div class="tab-pane fade" id="aboutTab">
                    <p>About CMS will be added here.</p>
                </div>

                <!-- Services Tab Placeholder -->
                <div class="tab-pane fade" id="servicesTab">
                    <p>Services CMS will be added here.</p>
                </div>

            </div>

        </div>
    </div>

</div>


<!-- ================= HERO MODAL ================= -->
<div class="modal fade" id="heroModal">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">
                    {{ isEditing ? 'Edit Hero' : 'Add Hero' }}
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <div class="mb-3">
                    <label class="form-label">Title (English)</label>
                    <input class="form-control" [(ngModel)]="form.title_en">
                </div>

                <div class="mb-3">
                    <label class="form-label">Title (Arabic)</label>
                    <input class="form-control" [(ngModel)]="form.title_ar">
                </div>

                <div class="mb-3">
                    <label class="form-label">Image</label>
                    <input type="file" class="form-control" (change)="onFileChange($event)">
                </div>

                <div *ngIf="previewImage" class="mt-3 text-left">
                    <img [src]="previewImage" class="img-fluid rounded shadow-sm"
                        style="max-height:100px; object-fit:cover;">
                </div>


            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">
                    Cancel
                </button>

                <button class="btn btn-primary" (click)="saveHero()">
                    Save
                </button>
            </div>

        </div>
    </div>
</div>


<!-- ================= DELETE MODAL ================= -->
<div class="modal fade" id="deleteModal">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h6 class="modal-title">Confirm Delete</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body text-center">
                Are you sure you want to delete this slide?
            </div>

            <div class="modal-footer justify-content-center">
                <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">
                    Cancel
                </button>
                <button class="btn btn-danger btn-sm" (click)="confirmDelete()">
                    Delete
                </button>
            </div>

        </div>
    </div>
</div>
