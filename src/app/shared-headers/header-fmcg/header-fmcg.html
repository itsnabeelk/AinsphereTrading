<!-- start: Search Popup -->
<div class="search-popup-overlay" (click)="closeSearch()"></div>
<div class="body-overlay" (click)="closeHamburger()"></div>
<!-- end: Search Popup -->

<!-- start: Hamburger Menu -->
<div class="hamburger-area d-lg-none">
    <div class="hamburger_bg"></div>
    <div class="hamburger_wrapper">
        <div class="hamburger_inner">
            <div class="hamburger_top d-flex align-items-center justify-content-between">
                <div class="hamburger_logo">
                    <a [routerLink]="['/fmcg-home']" class="mobile_logo">
                        <img src="/images/logos/fmcg-white.webp" alt="Logo">
                    </a>
                </div>
                <div class="hamburger_close">
                    <button class="hamburger_close_btn" (click)="closeHamburger()">
                        <i class="fa-thin fa-times"></i></button>
                </div>
            </div>
            <div class="hamburger-search-area">
                <h5 class="hamburger-title">Search Now!</h5>
                <div class="hamburger_search">
                    <form>
                        <button type="submit"><i class="tji-search"></i></button>
                        <input type="search" autocomplete="off" name="s" value="" placeholder="Search here...">
                    </form>
                </div>
            </div>
            <div class="hamburger_menu">
                <div class="mobile_menu"></div>
            </div>
            <div class="hamburger-infos">
                <h5 class="hamburger-title">Contact Info</h5>
                <div class="contact-info">
                    <div class="contact-item">
                        <span class="subtitle">Phone</span>
                        <a class="contact-link" href="tel:+966543612700">+966543612700</a>
                    </div>
                    <div class="contact-item">
                        <span class="subtitle">Email</span>
                        <a class="contact-link" href="mailto:info@ainsphere.com">info@ainsphere.com</a>
                    </div>
                    <div class="contact-item">
                        <span class="subtitle">Location</span>
                        <span class="contact-link">Saudi Arabia, Riyadh</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="hamburger-socials">
            <h5 class="hamburger-title">Follow Us</h5>
            <div class="social-links style-3">
                <ul>
                    <li><a href="https://www.facebook.com/" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
                    </li>
                    <li><a href="https://www.instagram.com/" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                    </li>
                    <li><a href="https://x.com/" target="_blank"><i class="fa-brands fa-x-twitter"></i></a></li>
                    <li><a href="https://www.linkedin.com/" target="_blank"><i class="fa-brands fa-linkedin-in"></i></a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
<!-- end: Hamburger Menu -->

<!-- start: Header Area -->
<header class="header-area header-2 header-absolute section-gap-x">
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">
                <div class="header-wrapper">
                    <!-- site logo -->
                    <div class="site_logo">
                        <a class="logo" [routerLink]="['/fmcg-home']"><img src="/images/logos/fmcg-white.webp"
                                alt=""></a>
                    </div>

                    <!-- navigation -->
                    <div class="menu-area d-none d-lg-inline-flex align-items-center">
                        <nav id="mobile-menu" class="mainmenu">
                            <ul>
                                <li class="urrent-menu-ancestor"><a [routerLink]="['/fmcg-home']">Home</a></li>
                                <li class="urrent-menu-ancestor"><a [routerLink]="['/fmcg-services']">Services</a>
                                </li>
                                <li class="urrent-menu-ancestor"><a [routerLink]="['/general-trading']">General</a>
                                </li>
                                <li class="urrent-menu-ancestor"><a href="#">MEP</a></li>
                                <li class="urrent-menu-ancestor"><a href="#">Uniforms</a></li>
                                <li><a [routerLink]="['/career']">Career</a></li>
                                <li><a [routerLink]="['/contact-us']">Contact Us</a></li>
                            </ul>
                        </nav>
                    </div>

                    <!-- header right info -->
                    <div class="header-right-item d-none d-lg-inline-flex">
                        <div class="header-search">
                            <button class="search" (click)="openSearch()">

                                <i class="tji-search"></i>
                            </button>
                            <button type="button" class="search_close_btn" (click)="closeSearch()">

                                <svg width="18" height="18" viewBox="0 0 18 18" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path d="M17 1L1 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                        stroke-linejoin="round" />
                                    <path d="M1 1L17 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                        stroke-linejoin="round" />
                                </svg>
                            </button>
                        </div>
                        <div class="header-button">
                            <a class="tj-primary-btn" href="#">
                                <span class="btn-text"><span>Arabic</span></span>
                                <span class="btn-icon d-block"><img src="../images/saudi.png" alt=""></span>
                            </a>
                        </div>
                    </div>

                    <!-- menu bar -->
                    <div class="menu_bar mobile_menu_bar d-lg-none" (click)="openHamburger()">

                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Search Popup -->
    <div class="search_popup">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-8">
                    <div class="tj_search_wrapper">
                        <div class="search_form">
                            <form action="#">
                                <div class="search_input">
                                    <div class="search-box">
                                        <input class="search-form-input" type="text"
                                            placeholder="Type Words and Hit Enter" required>
                                        <button type="submit">
                                            <i class="tji-search"></i>
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
<!-- end: Header Area -->
